{{ if site.Params.GoogleAnalytics4 }}
<script async src="https://www.googletagmanager.com/gtag/js?id={{ site.Params.GoogleAnalytics4 }}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', '{{ site.Params.GoogleAnalytics4 }}');
</script>
{{ end }}

{{ if site.Params.UmamiAnalytics }}
<script defer src="https://cloud.umami.is/script.js" data-website-id="{{ site.Params.UmamiAnalytics }}"></script>
{{ end }}
