{{ if site.Params.GoogleAnalytics4 }}
<script async src="https://www.googletagmanager.com/gtag/js?id={{ site.Params.GoogleAnalytics4 }}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', '{{ site.Params.GoogleAnalytics4 }}');
</script>
{{ end }}

{{ if site.Params.UmamiAnalytics }}
{{- $umamiHost := site.Params.UmamiHost | default "https://umami.dkko.me" -}}
<script defer src="{{ $umamiHost }}/script.js" data-website-id="{{ site.Params.UmamiAnalytics }}"></script>
<script defer src="{{ $umamiHost }}/recorder.js" data-website-id="{{ site.Params.UmamiAnalytics }}"></script>
{{ end }}
