{{ define "main" }}
<header class="post-header">
  <h1>{{ .Title }}</h1>
</header>
<div class="terms-cloud" style="display: flex; flex-wrap: wrap; gap: 1rem; justify-content: center; margin-top: 2rem;">
  {{ range .Pages }}
  <a href="{{ .Permalink }}" class="tag" style="font-size: {{ add 0.8 (mul (math.Log .Pages.Len) 0.2) }}rem; padding: 0.5rem 1rem;">
    {{ .Title }} <span style="opacity: 0.5; font-size: 0.8em;">({{ .Pages.Len }})</span>
  </a>
  {{ end }}
</div>
{{ end }}
